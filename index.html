<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Đồng Bộ Google Sheet</title>
    <style>
        /* CSS Giao diện chuẩn */
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #spin-wrapper { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            background: url('background.png') center/cover no-repeat; 
        }
        
        /* Vòng quay */
        #circle { 
            width: 90%; 
            max-width: 500px; 
            position: absolute; 
            top: 120px; left: 0; right: 0; bottom: 0; 
            margin: auto; 
            z-index: 1; 
            pointer-events: none; 
            transition: transform 3s ease-out; 
        }
        
        /* Nút quay / Kim chỉ ở giữa */
        #spinner { 
            width: 500px; 
            position: absolute; 
            top: 120px; left: 0; right: 0; bottom: 0; 
            margin: auto; 
            z-index: 50; 
            cursor: pointer; 
            pointer-events: auto; 
        }

        /* Hiệu ứng nhịp tim nhấp nháy cho nút quay (Chỉ chạy khi ĐÃ MỞ KHÓA) */
        #spinner:not(.disabled) {
            animation: zoom-in-out 0.6s infinite alternate; 
        }
        
        /* Khóa vòng quay khi chưa nhập thông tin hoặc đang xoay */
        .disabled { pointer-events: none !important; opacity: 0.6; filter: grayscale(50%); }
        
        @keyframes zoom-in-out { 0% { transform: scale(0.95); } 100% { transform: scale(1.02); } }
        
        /* Nền mờ phía sau các Popup */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 99; opacity: 0; pointer-events: none; transition: 0.3s; }
        .overlay.active { opacity: 1; pointer-events: auto; }

        /* Khung Popup Chung */
        .popup-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: white; padding: 28px; border-radius: 16px; display: flex; flex-direction: column; gap: 15px; z-index: 100; transition: transform 0.3s ease-out; min-width: 340px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.35); }
        .popup-box.active { transform: translate(-50%, -50%) scale(1); }
        
        /* 1. Giao diện POPUP NHẬP THÔNG TIN */
        #info-popup h2 { color: #333; font-size: 1.35rem; margin-bottom: 5px; }
        
        /* CẬP NHẬT CSS: Áp dụng cho cả input và thẻ select dropdown */
        #info-popup input, #info-popup select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 1rem; 
            outline: none; 
            transition: 0.2s; 
            background-color: #fff;
        }
        #info-popup input:focus, #info-popup select:focus { border-color: #e60000; box-shadow: 0 0 5px rgba(230,0,0,0.2); }
        #submit-info { padding: 13px; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-size: 1rem; background: #e60000; transition: 0.2s; }
        #submit-info:hover { background: #b30000; }

        /* 2. Giao diện POPUP PHẦN THƯỞNG */
        #reward-popup h2 { color: #cc0000; font-size: 1.5rem; line-height: 1.4; }
        
        /* Khung chứa ảnh quà */
        .reward-img-container { width: 100%; display: flex; justify-content: center; align-items: center; margin: 10px 0; min-height: 150px; }
        .reward-img-container img { max-width: 180px; max-height: 180px; object-fit: contain; animation: bounce 0.8s ease-out; }
        
        #close-reward { padding: 12px; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-size: 1rem; background: #333; transition: 0.2s; }
        #close-reward:hover { background: #000; }

        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="spin-wrapper">
        <img id="circle" src="circle.png" alt="Vòng quay">
        <img id="spinner" class="disabled" src="spinner.png" alt="Nút quay">
    </div>

    <div class="overlay active" id="overlay"></div>

    <div class="popup-box active" id="info-popup">
        <h2>Nhập thông tin Khách hàng</h2>
        <input type="text" id="name" placeholder="Họ và tên của bạn">
        <input type="text" id="phone" placeholder="Số điện thoại của bạn">
        
        <select id="head-branch">
            <option value="" disabled selected>-- Chọn cửa hàng --</option>
            <option value="HEAD VTP 2">HEAD VTP 2</option>
            <option value="VTP 5">VTP 5</option>
            <option value="VTP 6">VTP 6</option>
            <option value="VTP 7">VTP 7</option>
            <option value="VTP 8">VTP 8</option>
        </select>
        
        <button id="submit-info">Xác nhận thông tin</button>
    </div>

    <div class="popup-box" id="reward-popup">
        <h2 id="reward-title">Chúc mừng bạn!</h2>
        <div class="reward-img-container">
            <img id="reward-img" src="" alt="Hình ảnh phần thưởng">
        </div>
        <button id="close-reward">Quay tiếp lượt mới</button>
    </div>

    <script>
        // ================= CẤU HÌNH LIÊN KẾT GOOGLE SHEET =================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCcEAzB0-T9vkYVQazW3h5z7clF6Nyu9-9mxPMaNEU5gVqevO_WqPiWhLC_0HiR3hi/exec";
        
        // TỶ LỆ TRÚNG THƯỞNG THEO YÊU CẦU MỚI
        const RATE_XE_DIEN = 0;   // 3% trúng xe máy điện
        const RATE_MU_BH = 5;    // 20% trúng mũ bảo hiểm
        // (77% còn lại tự động rơi vào ô "Chúc bạn may mắn lần sau")
        // =================================================================

        const spinner = document.getElementById('spinner');
        const circle = document.getElementById('circle');
        const overlay = document.getElementById('overlay');
        
        const infoPopup = document.getElementById('info-popup');
        const submitInfoBtn = document.getElementById('submit-info');
        
        const rewardPopup = document.getElementById('reward-popup');
        const rewardTitle = document.getElementById('reward-title');
        const rewardImg = document.getElementById('reward-img');
        const closeRewardBtn = document.getElementById('close-reward');
        
        let totalDegrees = 0; 
        let isSpinning = false;
        let reward = "";

        let savedName = "";
        let savedPhone = "";
        let savedHead = ""; // THAY ĐỔI: Khởi tạo biến lưu thông tin HEAD

        // Hàm kiểm tra số lượng tồn kho thực tế từ ô F2 trên Google Sheet
        async function checkLiveStock() {
            if (!SCRIPT_URL) return 0; 
            try {
                let response = await fetch(SCRIPT_URL);
                let json = await response.json();
                return parseInt(json.data) || 0;
            } catch (e) {
                console.error("Lỗi kiểm tra kho:", e);
                return 0; // Nếu lỗi mạng, coi như bằng 0 để bảo vệ kho xe điện
            }
        }

        // 1. XỬ LÝ KHI BẤM NÚT XÁC NHẬN THÔNG TIN
        submitInfoBtn.addEventListener('click', () => {
            savedName = document.getElementById('name').value.trim();
            savedPhone = document.getElementById('phone').value.trim();
            savedHead = document.getElementById('head-branch').value; // THAY ĐỔI: Lấy giá trị của dropdown HEAD
            
            // THAY ĐỔI: Kiểm tra nếu chưa chọn HEAD thì báo lỗi
            if (!savedName || !savedPhone || !savedHead) {
                alert("Vui lòng nhập đầy đủ họ tên, số điện thoại và chọn cơ sở HEAD để tham gia!");
                return;
            }

            // Ẩn popup nhập thông tin đi
            infoPopup.classList.remove('active');
            overlay.classList.remove('active');
            
            // Kích hoạt nút quay nhấp nháy hoạt động bình thường
            spinner.classList.remove('disabled');
        });

        // 2. XỬ LÝ KHI BẤM NÚT QUAY CENTRUM (SPINNER)
        spinner.addEventListener('click', async () => {
            if (isSpinning) return; 
            isSpinning = true;
            spinner.classList.add('disabled'); // Khóa nút quay lập tức lúc đang xoay

            // Bước A: Gọi lên Google Sheet kiểm tra kho thực tế tại F2
            const currentStock = await checkLiveStock();

            // Bước B: Tính toán phần thưởng ngẫu nhiên
            let random = Math.floor(Math.random() * 100);
            let targetAngle = 0; 

            // Kiểm tra điều kiện trúng xe điện (Tỷ lệ 3% VÀ Kho F2 phải > 0)
            if (random < RATE_XE_DIEN && currentStock > 0) {
                reward = "Xe máy điện ICON e:";
                targetAngle = 270; // Quay đúng 180 độ đưa ô Xe Điện lên đỉnh (vị trí 12h)
                rewardImg.src = "xe-dien.png"; 
            } 
            // Trúng mũ bảo hiểm (Tỷ lệ từ 3% đến 23%)
            else if (random < (RATE_XE_DIEN + RATE_MU_BH)) {
                reward = "Mũ bảo hiểm";
                targetAngle = 30; // Quay đúng 300 độ đưa ô Mũ Bảo Hiểm lên đỉnh (vị trí 12h)
                rewardImg.src = "mu-bao-hiem.png"; 
            } 
            // May mắn lần sau (77% còn lại hoặc khi trúng xe điện nhưng kho bằng 0)
            else {
                reward = "Chúc bạn may mắn lần sau";
                targetAngle = 150; // Quay đúng 60 độ đưa ô May Mắn lên đỉnh (vị trí 12h)
                rewardImg.src = "may-man.png"; 
            }

            // Bước C: Xoay vòng quay (Quay ít nhất 5 vòng tạo hiệu ứng sinh động)
            totalDegrees += 1800 + (360 - (totalDegrees % 360)) + targetAngle;
            circle.style.transform = `rotate(${totalDegrees}deg)`;

            // Bước D: Đợi vòng quay dừng (3 giây giống CSS) rồi hiển thị kết quả
            setTimeout(async () => {
                if (reward === "Chúc bạn may mắn lần sau") {
                    rewardTitle.innerHTML = `Tiếc quá!<br><span style="font-size:1.1rem; color:#555; font-weight:normal;">Chúc bạn may mắn lần sau nhé!</span>`;
                } else {
                    rewardTitle.innerHTML = `Chúc mừng bạn!<br><span style="font-size:1.2rem; color:#e60000;">Bạn đã trúng: ${reward}</span>`;
                }
                
                // Hiển thị Popup kết quả phần thưởng
                overlay.classList.add('active');
                rewardPopup.classList.add('active');

                // Bước E: Đồng bộ gửi thông tin khách hàng và tự trừ kho lên Google Sheet
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: savedName,
                            phone: savedPhone,
                            head: savedHead, // THAY ĐỔI: Gửi thêm thông tin HEAD lên Google Sheet
                            reward: reward
                        })
                    });
                } catch (error) {
                    console.error("Lỗi đồng bộ dữ liệu Sheet:", error);
                }

                isSpinning = false;
            }, 3100); 
        });

        // 3. XỬ LÝ LƯỢT QUAY MỚI
        closeRewardBtn.addEventListener('click', () => {
            rewardPopup.classList.remove('active');
            
            // Xóa sạch dữ liệu cũ trong input và reset dropdown về mặc định
            document.getElementById('name').value = "";
            document.getElementById('phone').value = "";
            document.getElementById('head-branch').selectedIndex = 0; // THAY ĐỔI: Reset menu thả xuống
            
            // Quay lại popup thông tin ban đầu
            infoPopup.classList.add('active');
            overlay.classList.add('active');
        });
    </script>
</body>
</html>
